name: tocbump

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: latest
      - run: make toc
      - run: |
          if [[ $(git status --porcelain --untracked-files=no) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "update toc"
            make patch
            git push --tags origin master
            curl -fsS -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/release.yaml/dispatches" \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d "{\"ref\": \"$(git describe --tags --abbrev=0)\"}"
          else
            echo "Nothing to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
